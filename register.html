
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voter Registration | VoteSphere</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid;
            place-items: center; padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#4338ca,#c026d3);
        }
        .card {
            background: white; padding: 30px; border-radius: 20px;
            width: 100%; max-width: 430px;
            box-shadow: 0 15px 40px #17133b40;
        }
        h1 { color: #4338ca; margin-top: 0; }
        p { color: #666; line-height: 1.5; }
        label { display: block; font-weight: bold; margin: 18px 0 8px; }
        input {
            width: 100%; padding: 13px; border: 1px solid #ccc;
            border-radius: 9px; font-size: 16px;
        }
        button {
            width: 100%; margin-top: 22px; padding: 14px;
            border: 0; border-radius: 10px; color: white;
            background: #4f46e5; font-size: 16px;
            font-weight: bold; cursor: pointer;
        }
        .message {
            background: #fff1f2; color: #be123c;
            padding: 12px; border-radius: 8px;
        }
        .share { background: #059669; }
        .note { font-size: 12px; }
    </style>
</head>
<body>
<div class="card">
    <h1>🗳️ VoteSphere</h1>
    <h2>Voter Registration</h2>
    <p>Enter your details to continue to the voting page.</p>

    {% if message %}
    <p class="message">{{ message }}</p>
    {% endif %}

    <form method="POST" action="/">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text"
               maxlength="100" required placeholder="Enter your name">

        <label for="dob">Date of Birth</label>
        <input id="dob" name="dob" type="date" required>

        <button type="submit">Continue to Voting →</button>
    </form>

    <button class="share" type="button" onclick="shareLink()">
        🔗 Share Voting Link
    </button>
    <p class="note" id="shareMessage"></p>
    <p class="note">
        Demo website: name and DOB are not verified against official records.
    </p>
</div>

<script>
async function shareLink() {
    const link = window.location.origin;
    const output = document.getElementById("shareMessage");

    try {
        if (navigator.share) {
            await navigator.share({title: "VoteSphere", url: link});
        } else if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(link);
            output.textContent = "Link copied! Share it with others.";
        } else {
            window.prompt("Copy this link to share:", link);
        }
    } catch (e) {
        if (e.name !== "AbortError") {
            window.prompt("Copy this link to share:", link);
        }
    }
}
</script>
</body>
</html>
